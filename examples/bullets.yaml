        domains: [SWE, data]
      - id: ec-ci
        text: Containerized three legacy services with Docker and added CI checks, halving deploy time
        domains: [SWE, IT]
      - id: ec-dash
        text: Wrote SQL views and a Tableau dashboard used by the operations team for weekly planning
        domains: [data]

