# FAKE fixture. Copy to $JOBAGENT_HOME/bullets.yaml (jobagent init does this)
# and replace everything with your own real bullets.
#
# This file is the ONLY source of resume content. The writer can select,
# reorder and lightly rephrase these bullets. It can never add a skill, tool,
# number, date or employer that isn't written here.
#
# Text is LaTeX: escape % & $ # _ as \% \& \$ \# \_.
# domains: any of IT, SWE, data, ML (used to rank bullets for a posting).
# ids must be unique across the whole file.

skills:
  Languages: [Python, SQL, TypeScript, Bash]
  Frameworks: [FastAPI, React, PyTorch, pandas]
  Tools: [Docker, Git, PostgreSQL, Linux, Tableau]

