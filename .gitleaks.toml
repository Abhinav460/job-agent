title = "job-agent gitleaks config"

# Start from gitleaks' built-in rules (Anthropic, GCP API keys, private keys,
# GCP service accounts, GitHub tokens, ...) and add the ones it lacks.
[extend]
useDefault = true

[[rules]]
id = "langsmith-api-key"
description = "LangSmith API key"
regex = '''\b(?:lsv2_(?:pt|sk)_[0-9a-f]{32}_[0-9a-f]{10}|ls__[0-9a-f]{32})\b'''
keywords = ["lsv2_", "ls__"]

[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''\bya29\.[0-9A-Za-z_\-]{20,}'''
keywords = ["ya29."]

[[rules]]
id = "tailscale-key"
description = "Tailscale auth/API/client key"
regex = '''tskey-(?:auth|api|client|scim|webhook)-[a-zA-Z0-9-]{10,}'''
keywords = ["tskey-"]

[[rules]]
id = "gcp-service-account-json"
description = "Google service-account key file contents"
regex = '''"type"\s*:\s*"service_account"'''
keywords = ["service_account"]
# Commit 501ff3e had this pattern as a literal in a redaction test (fake data,
# since rewritten by string concatenation). Allow only that commit and file.
[[rules.allowlists]]
condition = "AND"
commits = ["501ff3e2de149b6ed8d6fa8035892dcf38d97819"]
paths = ['''^tests/test_redaction\.py$''']
