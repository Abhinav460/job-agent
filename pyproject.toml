[project]
name = "job-agent"
version = "0.1.0"
description = "Personal job-application agent: tailors a LaTeX resume, pre-fills forms, and leaves submission to a human."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
