[project]
name = "job-agent"
version = "0.1.0"
description = "Personal job-application agent: tailors a LaTeX resume, pre-fills forms, and leaves submission to a human."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
